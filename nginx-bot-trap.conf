# ══════════════════════════════════════════════════════════════════════════════
# qalarc.com — Bot Trap Nginx Configuration
# ══════════════════════════════════════════════════════════════════════════════
#
# Add this to your server block (or include it).
# The bot-trap.js server must be running on port 4444.
#
# SETUP:
#   1. Start the trap server:  node /path/to/bot-trap.js &
#      (or use systemd, see bot-trap.service below)
#   2. Add this config to your nginx server block
#   3. Reload nginx: sudo nginx -s reload
#
# ══════════════════════════════════════════════════════════════════════════════

# ── User-agent based bot detection map ──────────────────────────────────────
#
# Place this OUTSIDE the server block, in the http {} context.
# (usually in /etc/nginx/nginx.conf or /etc/nginx/conf.d/bot-map.conf)

map $http_user_agent $is_bot {
    default                     0;

    # Known scrapers and crawlers
    ~*bot                       1;
    ~*crawler                   1;
    ~*spider                    1;
    ~*scraper                   1;
    ~*curl                      1;
    ~*wget                      1;
    ~*python-requests           1;
    ~*python-urllib             1;
    ~*axios                     1;
    ~*node-fetch                1;
    ~*go-http-client            1;
    ~*java/                     1;
    ~*okhttp                    1;
    ~*headless                  1;
    ~*phantomjs                 1;
    ~*puppeteer                 1;
    ~*playwright                1;
    ~*selenium                  1;
    ~*scrapy                    1;
    ~*httrack                   1;
    ~*masscan                   1;
    ~*nikto                     1;
    ~*sqlmap                    1;
    ~*ahrefsbot                 1;
    ~*semrushbot                1;
    ~*dotbot                    1;
    ~*mj12bot                   1;
    ~*blexbot                   1;
    ~*dataprovider              1;

    # Allow legit search engines through
    ~*Googlebot                 0;
    ~*Bingbot                   0;
    ~*Slurp                     0;
    ~*DuckDuckBot               0;
}

# ── Server block additions ───────────────────────────────────────────────────
# Add INSIDE your existing server {} block:

server {
    listen 80;
    server_name qalarc.com www.qalarc.com;

    # ── Serve bot-trap-client.js to all visitors ──────────────────────────
    location = /bot-trap-client.js {
        alias /path/to/bot-trap-client.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Trap zone: always proxied to bot-trap server ──────────────────────
    location /trap/ {
        proxy_pass http://127.0.0.1:4444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Don't index trap pages
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Route detected bots to the trap ──────────────────────────────────
    # This catches bots accessing your REAL pages and redirects them
    location / {
        if ($is_bot = 1) {
            return 302 /trap/entry;
        }

        # Normal serving of your site
        try_files $uri $uri/ $uri.html =404;
        root /path/to/your/public_html;
        index index.html;
    }

    # ── Rate limiting for bots (extra layer) ─────────────────────────────
    # Add to http {} context:
    # limit_req_zone $binary_remote_addr zone=bots:10m rate=5r/s;
    # Then in the /trap/ location:
    # limit_req zone=bots burst=20 nodelay;
}


# ══════════════════════════════════════════════════════════════════════════════
# SYSTEMD SERVICE — Run bot-trap.js as a service
# Save as: /etc/systemd/system/bot-trap.service
# Then: sudo systemctl enable bot-trap && sudo systemctl start bot-trap
# ══════════════════════════════════════════════════════════════════════════════

# [Unit]
# Description=qalarc.com Bot Trap Server
# After=network.target
#
# [Service]
# Type=simple
# User=www-data
# WorkingDirectory=/path/to/bot_loop_for_projects_anti_scrape
# ExecStart=/usr/bin/node bot-trap.js
# Restart=always
# RestartSec=5
# Environment=PORT=4444
#
# [Install]
# WantedBy=multi-user.target
